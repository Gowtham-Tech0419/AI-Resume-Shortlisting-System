<!DOCTYPE html>
<html>
<head>
    <title>Post a Job Description</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Post a Job Description</h1>

    <form action="/submit_jd" method="POST">
        <input type="text" name="job_title" placeholder="Job Title" required><br><br>
        <textarea name="job_description" rows="10" cols="50" placeholder="Paste job description here..." required></textarea><br><br>
        <button type="submit">Submit Job Description</button>
    </form>
</body>
</html>
